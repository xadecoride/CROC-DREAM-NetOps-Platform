hostname: spine-2.croc.lab
interfaces:
- name: Ethernet1
  enabled: true
  mode: l3
  mtu: 1500
  description: Downlink to leaf1 GE1/0/1
  ipv4_address: 10.10.0.4/31
  acl_in: FABRIC-IN
  ospf_area: 0.0.0.0
- name: Ethernet2
  enabled: true
  mode: l3
  mtu: 1500
  description: Downlink to leaf2 GE1/0/1
  ipv4_address: 10.10.0.6/31
  acl_in: FABRIC-IN
  ospf_area: 0.0.0.0
- name: Ethernet3
  enabled: true
  mode: l3
  mtu: 1500
  description: Downlink to leaf3 GigabitEthernet3
  ipv4_address: 10.10.0.12/31
  acl_in: FABRIC-IN
  ospf_area: 0.0.0.0
- name: Ethernet4
  enabled: true
  mode: l3
  mtu: 1500
  description: Downlink to leaf4 Ethernet2
  ipv4_address: 10.10.0.16/31
  acl_in: FABRIC-IN
  ospf_area: 0.0.0.0
- name: Loopback0
  enabled: true
  mode: l3
  mtu: 1500
  description: Router-ID / BGP announce
  ipv4_address: 10.255.0.12/32
  ospf_area: 0.0.0.0
bgp:
  asn: 65011
  router_id: 10.255.0.12
  neighbors:
  - peer_ip: 10.10.0.5
    remote_asn: 65001
    description: leaf1
    announced_prefixes:
    - 10.255.0.12/32
  - peer_ip: 10.10.0.7
    remote_asn: 65002
    description: leaf2
    announced_prefixes:
    - 10.255.0.12/32
  - peer_ip: 10.10.0.13
    remote_asn: 65003
    description: leaf3
    announced_prefixes:
    - 10.255.0.12/32
  - peer_ip: 10.10.0.17
    remote_asn: 65004
    description: leaf4
    announced_prefixes:
    - 10.255.0.12/32
  evpn: true
acls:
- name: FABRIC-IN
  rules:
  - sequence: 10
    action: permit
    protocol: icmp
    source: any
    destination: any
  - sequence: 15
    action: permit
    protocol: ospf
    source: any
    destination: any
  - sequence: 20
    action: permit
    protocol: tcp
    source: any
    destination: any
    dst_port: bgp
  - sequence: 30
    action: permit
    protocol: tcp
    source: any
    destination: any
    src_port: bgp
  - sequence: 40
    action: deny
    protocol: tcp
    source: any
    destination: any
    dst_port: telnet
  - sequence: 50
    action: permit
    protocol: ip
    source: any
    destination: any
