---
hostname: "spine-2.croc.lab"

interfaces:
  - name: "Ethernet1"
    description: "Downlink to leaf-1.croc.lab"
    enabled: true
    mode: "l3"
    # REASON: Выделена P2P-подсеть /31 для линка spine2-leaf1: 10.0.1.4/31 (.4 — spine, .5 — leaf)
    ipv4_address: "10.0.1.4/31"
    mtu: 1500

  - name: "Ethernet2"
    description: "Downlink to leaf-2.croc.lab"
    enabled: true
    mode: "l3"
    # REASON: Выделена P2P-подсеть /31 для линка spine2-leaf2: 10.0.1.6/31 (.6 — spine, .7 — leaf)
    ipv4_address: "10.0.1.6/31"
    mtu: 1500

bgp:
  asn: 65000 # REASON: Общий ASN уровня Spine для балансировки трафика
  router_id: "10.255.0.2" # REASON: Идентификатор router-id Spine2
  neighbors:
    - peer_ip: "10.0.1.5"
      remote_asn: 65101 # REASON: Приватный ASN соседа leaf-1
      description: "leaf-1.croc.lab"
      announced_prefixes:
        - "10.255.0.2/32"
    - peer_ip: "10.0.1.7"
      remote_asn: 65102 # REASON: Приватный ASN соседа leaf-2
      description: "leaf-2.croc.lab"
      announced_prefixes:
        - "10.255.0.2/32"

acls: []