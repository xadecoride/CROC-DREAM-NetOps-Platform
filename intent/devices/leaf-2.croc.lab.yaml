---
hostname: "leaf-2.croc.lab"

interfaces:
  - name: "GE1/0/0"
    description: "Uplink to spine-1.croc.lab"
    enabled: true
    mode: "l3"
    ipv4_address: "10.0.1.3/31"
    mtu: 1500

  - name: "GE1/0/1"
    description: "Uplink to spine-2.croc.lab"
    enabled: true
    mode: "l3"
    ipv4_address: "10.0.1.7/31"
    mtu: 1500

  - name: "GE1/0/9"
    description: "Client link to host-b"
    enabled: true
    mode: "l3"
    # REASON: На host-b шлюз задан как 10.10.12.1, поэтому интерфейс настраивается этим адресом
    ipv4_address: "10.10.12.1/24"
    mtu: 1500

bgp:
  asn: 65102 # REASON: Выделенный приватный ASN для leaf-2
  router_id: "10.255.0.12" # REASON: Идентификатор router-id Leaf2
  neighbors:
    - peer_ip: "10.0.1.2"
      remote_asn: 65000
      description: "spine-1.croc.lab"
      announced_prefixes:
        # REASON: Анонсируем клиентскую сеть host-b, чтобы она стала доступна в фабрике
        - "10.10.12.0/24"
        - "10.255.0.12/32"
    - peer_ip: "10.0.1.6"
      remote_asn: 65000
      description: "spine-2.croc.lab"
      announced_prefixes:
        - "10.10.12.0/24"
        - "10.255.0.12/32"

acls: []