hostname: spine-1.croc.lab
interfaces:
  - name: Loopback0
    description: Router ID
    ipv4_address: 10.255.0.1/32
  - name: Ethernet1
    description: Downlink to leaf-1
    ipv4_address: 10.0.1.0/31
    mtu: 9000
  - name: Ethernet2
    description: Downlink to leaf-2
    ipv4_address: 10.0.2.0/31
    mtu: 9000
bgp:
  asn: 65000
  router_id: 10.255.0.1
  neighbors:
    - peer_ip: 10.0.1.1
      remote_asn: 65101
      description: leaf-1
      announced_prefixes: ["10.255.0.1/32"]
    - peer_ip: 10.0.2.1
      remote_asn: 65102
      description: leaf-2
      announced_prefixes: ["10.255.0.1/32"]
