---
hostname: "spine-1.croc.lab"

interfaces:
  - name: "GigabitEthernet2"
    description: "Downlink to leaf-1.croc.lab"
    enabled: true
    mode: "l3"
    # REASON: Выделена P2P-подсеть /31 (RFC 3021) для линка spine1-leaf1: 10.0.1.0/31 (.0 — spine, .1 — leaf)
    ipv4_address: "10.0.1.0/31"
    mtu: 1500 # REASON: Стандартный размер MTU по умолчанию

  - name: "GigabitEthernet3"
    description: "Downlink to leaf-2.croc.lab"
    enabled: true
    mode: "l3"
    # REASON: Выделена P2P-подсеть /31 для линка spine1-leaf2: 10.0.1.2/31 (.2 — spine, .3 — leaf)
    ipv4_address: "10.0.1.2/31"
    mtu: 1500

bgp:
  asn: 65000 # REASON: Приватный ASN уровня Spine (RFC 6996)
  router_id: "10.255.0.1" # REASON: Адрес идентификатора из диапазона Loopback 10.255.0.0/24
  neighbors:
    - peer_ip: "10.0.1.1"
      remote_asn: 65101 # REASON: Приватный ASN соседа leaf-1
      description: "leaf-1.croc.lab"
      announced_prefixes:
        - "10.255.0.1/32" # REASON: Анонс собственного router-id
    - peer_ip: "10.0.1.3"
      remote_asn: 65102 # REASON: Приватный ASN соседа leaf-2
      description: "leaf-2.croc.lab"
      announced_prefixes:
        - "10.255.0.1/32"

acls: []