hostname: leaf-1.croc.lab
interfaces:
  - name: Loopback0
    description: Router ID
    ipv4_address: 10.255.1.1/32
  - name: GigabitEthernet2
    description: Uplink to spine-1
    ipv4_address: 10.0.1.1/31
    mtu: 9000
  - name: GigabitEthernet3
    description: Uplink to spine-2
    ipv4_address: 10.0.1.3/31
    mtu: 9000
  - name: GigabitEthernet4
    description: Unused
    enabled: false
bgp:
  asn: 65101
  router_id: 10.255.1.1
  neighbors:
    - peer_ip: 10.0.1.0
      remote_asn: 65000
      description: spine-1
      password: fabric-secret
      announced_prefixes: ["10.255.1.1/32"]
    - peer_ip: 10.0.1.2
      remote_asn: 65000
      description: spine-2
      password: fabric-secret
      announced_prefixes: ["10.255.1.1/32"]
acls:
  - name: MGMT-IN
    rules:
      - sequence: 10
        action: permit
        protocol: tcp
        source: 172.20.20.0/24
        destination: any
      - sequence: 20
        action: deny
        protocol: ip
        source: any
        destination: any
