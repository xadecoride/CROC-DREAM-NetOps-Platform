sysname spine-3
acl name FABRIC-IN advance
 rule 10 permit icmp
 rule 15 permit ospf
 rule 20 permit tcp destination-port eq bgp
 rule 30 permit tcp source-port eq bgp
 rule 40 deny tcp destination-port eq telnet
 rule 50 permit ip
interface GE1/0/0
 undo portswitch
 description Downlink to leaf1 GE1/0/2
 ip address 10.10.0.18 255.255.255.254
 ospf network-type p2p
interface GE1/0/1
 undo portswitch
 description Downlink to leaf2 GE1/0/2
 ip address 10.10.0.20 255.255.255.254
 ospf network-type p2p
interface LoopBack0
 description Router-ID / BGP announce
 ip address 10.255.0.13 255.255.255.255
bgp 65000
 router-id 10.255.0.13
 peer 10.10.0.19 as-number 65001
 peer 10.10.0.19 description leaf1
 peer 10.10.0.21 as-number 65002
 peer 10.10.0.21 description leaf2
 peer 10.10.0.23 as-number 65003
 peer 10.10.0.23 description leaf3
 peer 10.10.0.25 as-number 65004
 peer 10.10.0.25 description leaf4
 ipv4-family unicast
  preference 20 200 200
  network 10.255.0.13 255.255.255.255
  maximum load-balancing 4
  peer 10.10.0.19 enable
  peer 10.10.0.21 enable
  peer 10.10.0.23 enable
  peer 10.10.0.25 enable
 l2vpn-family evpn
  policy vpn-target
  peer 10.10.0.19 enable
  peer 10.10.0.19 advertise irb
  peer 10.10.0.21 enable
  peer 10.10.0.21 advertise irb
  peer 10.10.0.23 enable
  peer 10.10.0.23 advertise irb
  peer 10.10.0.25 enable
  peer 10.10.0.25 advertise irb
