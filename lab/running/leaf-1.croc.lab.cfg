hostname leaf-1.croc.lab
interface Loopback0
 description Router ID
 ip address 10.255.1.1 255.255.255.255
 no shutdown
interface GigabitEthernet2
 description Uplink to spine-1
 mtu 9000
 ip address 10.0.1.1 255.255.255.254
 no shutdown
interface GigabitEthernet3
 description Uplink to spine-2
 mtu 9000
 ip address 10.0.1.3 255.255.255.254
 no shutdown
interface GigabitEthernet4
 description Unused
 shutdown
ip access-list extended MGMT-IN
 10 permit tcp 172.20.20.0 0.0.0.255 any
 15 permit ip any any
 20 deny ip any any
router bgp 65101
 bgp router-id 10.255.1.1
 neighbor 10.0.1.0 remote-as 65000
 neighbor 10.0.1.0 description spine-1
 neighbor 10.0.1.0 password fabric-secret
 neighbor 10.0.1.2 remote-as 65000
 neighbor 10.0.1.2 description spine-2
 neighbor 10.0.1.2 password fabric-secret
 address-family ipv4 unicast
  network 10.255.1.1 mask 255.255.255.255
  neighbor 10.0.1.0 activate
  neighbor 10.0.1.2 activate
