hostname leaf-4
interface Ethernet1
   description Uplink to spine1 GigabitEthernet5
   no switchport
   ip address 10.10.0.15/31
   ip access-group FABRIC-IN in
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
interface Ethernet2
   description Uplink to spine2 Ethernet4
   no switchport
   ip address 10.10.0.17/31
   ip access-group FABRIC-IN in
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
interface Ethernet3
   description Uplink to spine3 GE1/0/3
   no switchport
   ip address 10.10.0.25/31
   ip access-group FABRIC-IN in
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
interface Loopback0
   description Router-ID / BGP announce / VTEP source
   ip address 10.255.0.4/32
   ip ospf area 0.0.0.0
ip access-list FABRIC-IN
   10 permit icmp any any
   15 permit ospf any any
   20 permit tcp any any eq bgp
   30 permit tcp any eq bgp any
   40 deny tcp any any eq telnet
   50 permit ip any any
ip routing
router bgp 65004
   router-id 10.255.0.4
   no bgp default ipv4-unicast
   neighbor 10.10.0.14 remote-as 65000
   neighbor 10.10.0.14 description spine1
   neighbor 10.10.0.14 send-community extended
   neighbor 10.10.0.16 remote-as 65000
   neighbor 10.10.0.16 description spine2
   neighbor 10.10.0.16 send-community extended
   neighbor 10.10.0.24 remote-as 65000
   neighbor 10.10.0.24 description spine3
   neighbor 10.10.0.24 send-community extended
   address-family evpn
      neighbor 10.10.0.14 activate
      neighbor 10.10.0.14 next-hop-unchanged
      neighbor 10.10.0.16 activate
      neighbor 10.10.0.16 next-hop-unchanged
      neighbor 10.10.0.24 activate
      neighbor 10.10.0.24 next-hop-unchanged
   address-family ipv4
      neighbor 10.10.0.14 activate
      neighbor 10.10.0.16 activate
      neighbor 10.10.0.24 activate
      network 10.255.0.4/32
