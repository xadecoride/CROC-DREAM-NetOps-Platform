hostname leaf-2.croc.lab
interface Loopback0
 description Router ID
 ip address 10.255.1.2 255.255.255.255
 no shutdown
interface GigabitEthernet2
 description Uplink to spine-1
 mtu 9000
 ip address 10.0.2.1 255.255.255.254
 no shutdown
interface GigabitEthernet3
 description Uplink to spine-2
 mtu 9000
 ip address 10.0.2.3 255.255.255.254
 no shutdown
router bgp 65102
 bgp router-id 10.255.1.2
 neighbor 10.0.2.0 remote-as 65000
 neighbor 10.0.2.0 description spine-1
 neighbor 10.0.2.2 remote-as 65000
 neighbor 10.0.2.2 description spine-2
 address-family ipv4 unicast
  network 10.255.1.2 mask 255.255.255.255
  neighbor 10.0.2.0 activate
  neighbor 10.0.2.2 activate
