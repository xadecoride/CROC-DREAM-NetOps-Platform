sysname leaf-2
acl name FABRIC-IN advance
 rule 10 permit icmp
 rule 15 permit ospf
 rule 20 permit tcp destination-port eq bgp
 rule 30 permit tcp source-port eq bgp
 rule 40 deny tcp destination-port eq telnet
 rule 50 permit ip
interface Vbdif10
 description Anycast gateway VLAN10 10.20.1.0/24
 ip address 10.20.1.1 255.255.255.0
 arp distribute-gateway enable
interface GE1/0/0
 undo portswitch
 description Uplink to spine1 GigabitEthernet3
 ip address 10.10.0.3 255.255.255.254
 ospf network-type p2p
interface GE1/0/1
 undo portswitch
 description Uplink to spine2 Ethernet2
 ip address 10.10.0.7 255.255.255.254
 ospf network-type p2p
interface LoopBack0
 description Router-ID / BGP announce / VTEP source
 ip address 10.255.0.2 255.255.255.255
interface Nve1
 description VXLAN VTEP
 source 10.255.0.2
 vni 10010 head-end peer-list protocol bgp
bgp 65002
 router-id 10.255.0.2
 peer 10.10.0.2 as-number 65000
 peer 10.10.0.2 description spine1
 peer 10.10.0.6 as-number 65000
 peer 10.10.0.6 description spine2
 peer 10.10.0.20 as-number 65000
 peer 10.10.0.20 description spine3
 ipv4-family unicast
  preference 20 200 200
  network 10.255.0.2 255.255.255.255
  maximum load-balancing 3
  peer 10.10.0.2 enable
  peer 10.10.0.6 enable
  peer 10.10.0.20 enable
 l2vpn-family evpn
  policy vpn-target
  peer 10.10.0.2 enable
  peer 10.10.0.2 advertise irb
  peer 10.10.0.6 enable
  peer 10.10.0.6 advertise irb
  peer 10.10.0.20 enable
  peer 10.10.0.20 advertise irb
