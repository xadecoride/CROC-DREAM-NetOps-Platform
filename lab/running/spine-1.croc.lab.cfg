hostname spine-1
interface Loopback0
 description Router-ID / BGP announce
 ip address 10.255.0.11 255.255.255.255
 ip ospf 1 area 0
interface GigabitEthernet2
 description Downlink to leaf1 GE1/0/0
 ip address 10.10.0.0 255.255.255.254
 ip access-group FABRIC-IN in
 ip ospf network point-to-point
 ip ospf 1 area 0
 negotiation auto
interface GigabitEthernet3
 description Downlink to leaf2 GE1/0/0
 ip address 10.10.0.2 255.255.255.254
 ip access-group FABRIC-IN in
 ip ospf network point-to-point
 ip ospf 1 area 0
 negotiation auto
interface GigabitEthernet4
 description Downlink to leaf3 GigabitEthernet2
 ip address 10.10.0.8 255.255.255.254
 ip access-group FABRIC-IN in
 ip ospf network point-to-point
 ip ospf 1 area 0
 negotiation auto
interface GigabitEthernet5
 description Downlink to leaf4 Ethernet1
 ip address 10.10.0.14 255.255.255.254
 ip access-group FABRIC-IN in
 ip ospf network point-to-point
 ip ospf 1 area 0
 negotiation auto
router bgp 65000
 bgp router-id 10.255.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.10.0.1 remote-as 65001
 neighbor 10.10.0.1 description leaf-1
 neighbor 10.10.0.3 remote-as 65002
 neighbor 10.10.0.3 description leaf-2
 neighbor 10.10.0.9 remote-as 65003
 neighbor 10.10.0.9 description leaf-3
 neighbor 10.10.0.15 remote-as 65004
 neighbor 10.10.0.15 description leaf-4
 address-family ipv4
  network 10.255.0.11 mask 255.255.255.255
  neighbor 10.10.0.1 activate
  neighbor 10.10.0.3 activate
  neighbor 10.10.0.9 activate
  neighbor 10.10.0.15 activate
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.10.0.1 activate
  neighbor 10.10.0.1 send-community both
  neighbor 10.10.0.1 next-hop-unchanged
  neighbor 10.10.0.3 activate
  neighbor 10.10.0.3 send-community both
  neighbor 10.10.0.3 next-hop-unchanged
  neighbor 10.10.0.9 activate
  neighbor 10.10.0.9 send-community both
  neighbor 10.10.0.9 next-hop-unchanged
  neighbor 10.10.0.15 activate
  neighbor 10.10.0.15 send-community both
  neighbor 10.10.0.15 next-hop-unchanged
 exit-address-family
ip access-list extended FABRIC-IN
 10 permit icmp any any
 15 permit ospf any any
 20 permit tcp any any eq bgp
 30 permit tcp any eq bgp any
 40 deny   tcp any any eq telnet
 50 permit ip any any
