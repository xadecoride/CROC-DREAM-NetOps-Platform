hostname leaf-3
interface Loopback0
 description Router-ID / BGP announce / VTEP source
 ip address 10.255.0.3 255.255.255.255
 ip ospf 1 area 0
interface GigabitEthernet2
 description Uplink to spine1 GigabitEthernet4
 ip address 10.10.0.9 255.255.255.254
 ip access-group FABRIC-IN in
 ip ospf network point-to-point
 ip ospf 1 area 0
 negotiation auto
interface GigabitEthernet3
 description Uplink to spine2 Ethernet3
 ip address 10.10.0.13 255.255.255.254
 ip access-group FABRIC-IN in
 ip ospf network point-to-point
 ip ospf 1 area 0
 negotiation auto
interface GigabitEthernet4
 description Uplink to spine3 GE1/0/2
 ip address 10.10.0.23 255.255.255.254
 ip access-group FABRIC-IN in
 ip ospf network point-to-point
 ip ospf 1 area 0
 negotiation auto
router bgp 65003
 bgp router-id 10.255.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.10.0.8 remote-as 65000
 neighbor 10.10.0.8 description spine1
 neighbor 10.10.0.12 remote-as 65000
 neighbor 10.10.0.12 description spine2
 neighbor 10.10.0.22 remote-as 65000
 neighbor 10.10.0.22 description spine3
 address-family ipv4
  network 10.255.0.3 mask 255.255.255.255
  neighbor 10.10.0.8 activate
  neighbor 10.10.0.12 activate
  neighbor 10.10.0.22 activate
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.10.0.8 activate
  neighbor 10.10.0.8 send-community both
  neighbor 10.10.0.8 next-hop-unchanged
  neighbor 10.10.0.12 activate
  neighbor 10.10.0.12 send-community both
  neighbor 10.10.0.12 next-hop-unchanged
  neighbor 10.10.0.22 activate
  neighbor 10.10.0.22 send-community both
  neighbor 10.10.0.22 next-hop-unchanged
 exit-address-family
ip access-list extended FABRIC-IN
 10 permit icmp any any
 15 permit ospf any any
 20 permit tcp any any eq bgp
 30 permit tcp any eq bgp any
 40 deny   tcp any any eq telnet
 50 permit ip any any
