! Command: show running-config
! device: spine-2 (cEOSLab, EOS-4.32.0F)
!
no aaa root
username admin privilege 15 role network-admin secret sha512 $6$8el7Sqjp8re5MhG3$Z00NJOkXHHld1v7okq4AEnc7DXkZBNrLhKjI9bxRc90bhR/Zx4SjzeWQ.UrDkSn57aQXTScokN9kblwcNOnTG/
service routing protocols model multi-agent
hostname spine-2
snmp-server community public ro
lldp run
spanning-tree mode mstp
!
ip routing
!
ip access-list FABRIC-IN
   10 permit icmp any any
   20 permit tcp any any eq bgp
   30 permit tcp any eq bgp any
   40 deny tcp any any eq telnet
   50 permit ip any any
!
interface Loopback0
   description Router-ID / BGP announce
   ip address 10.255.0.12/32
!
interface Ethernet1
   description Downlink to leaf1 GE1/0/1
   no switchport
   ip address 10.10.0.4/31
   ip access-group FABRIC-IN in
   no shutdown
!
interface Ethernet2
   description Downlink to leaf2 GE1/0/1
   no switchport
   ip address 10.10.0.6/31
   ip access-group FABRIC-IN in
   no shutdown
!
interface Management0
   ip address 172.20.20.4/24
   ipv6 address 2001:172:20:20::4/64
!
ip route 0.0.0.0/0 172.20.20.1
ipv6 route ::/0 2001:172:20:20::1
!
router bgp 65000
   router-id 10.255.0.12
   no bgp default ipv4-unicast
   neighbor 10.10.0.5 remote-as 65001
   neighbor 10.10.0.5 description leaf1
   neighbor 10.10.0.7 remote-as 65002
   neighbor 10.10.0.7 description leaf2
   !
   address-family ipv4
      network 10.255.0.12/32
      neighbor 10.10.0.5 activate
      neighbor 10.10.0.7 activate
!
management api http-commands
   no shutdown
!
end
