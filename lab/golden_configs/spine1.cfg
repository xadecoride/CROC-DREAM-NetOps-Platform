version 17.3
service timestamps debug datetime msec
service timestamps log datetime msec
platform qfp utilization monitor load 80
platform console serial
hostname spine1
!
vrf definition clab-mgmt
 description Containerlab management VRF (DO NOT DELETE)
 address-family ipv4
 exit-address-family
!
enable password F5ga6jfkig1
no aaa new-model
ip domain name example.com
!
# REASON: Пароль заменён на F5ga6jfkig1 в открытом виде (не secret) по требованию задачи
username admin privilege 15 password 0 F5ga6jfkig1
!
# REASON: Management-интерфейс оставляем строго 10.0.0.15, так как vrnetlab проксирует SSH через него
interface GigabitEthernet1
 description Management interface
 vrf forwarding clab-mgmt
 ip address 10.0.0.15 255.255.255.0
 negotiation auto
!
# REASON: Loopback интерфейс с Router-ID для работы BGP
interface Loopback0
 description Router-ID
 ip address 10.255.0.1 255.255.255.255
!
# REASON: Линк к leaf1 (eth1 в clab): включен (no shutdown), настроен L3 IP-адрес /31
interface GigabitEthernet2
 description Downlink to leaf-1.croc.lab
 ip address 10.0.1.0 255.255.255.254
 no shutdown
 negotiation auto
!
# REASON: Линк к leaf2 (eth2 в clab): включен (no shutdown), настроен L3 IP-адрес /31
interface GigabitEthernet3
 description Downlink to leaf-2.croc.lab
 ip address 10.0.1.2 255.255.255.254
 no shutdown
 negotiation auto
!
ip route vrf clab-mgmt 0.0.0.0 0.0.0.0 10.0.0.2
ip ssh maxstartups 128
!
# REASON: BGP процесс фабрики (ASN 65000): связь с Leaf1 (65101) и Leaf2 (65102), анонс собственного Loopback
router bgp 65000
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 neighbor 10.0.1.1 remote-as 65101
 neighbor 10.0.1.1 description leaf-1.croc.lab
 neighbor 10.0.1.3 remote-as 65102
 neighbor 10.0.1.3 description leaf-2.croc.lab
 !
 address-family ipv4
  network 10.255.0.1 mask 255.255.255.255
  neighbor 10.0.1.1 activate
  neighbor 10.0.1.3 activate
 exit-address-family
!
netconf-yang
restconf
!
line con 0
 stopbits 1
line vty 0 4
 login local
 transport input ssh
!
end