version 17.3
service timestamps debug datetime msec
service timestamps log datetime msec
platform qfp utilization monitor load 80
platform console serial
hostname spine-1
!
vrf definition clab-mgmt
 description Containerlab management VRF (DO NOT DELETE)
 address-family ipv4
 exit-address-family
!
enable password F5ga6jfkig1
no aaa new-model
ip domain name example.com
!
lldp run
!
username admin privilege 15 password 0 F5ga6jfkig1
!
interface GigabitEthernet1
 description Management interface
 vrf forwarding clab-mgmt
 ip address 10.0.0.15 255.255.255.0
 no shutdown
 negotiation auto
!
interface Loopback0
 description Router-ID / BGP announce
 ip address 10.255.0.11 255.255.255.255
!
ip access-list extended FABRIC-IN
 10 permit icmp any any
 20 permit tcp any any eq bgp
 30 permit tcp any eq bgp any
 40 deny tcp any any eq telnet
 50 permit ip any any
!
interface GigabitEthernet2
 description Downlink to leaf1 GE1/0/0
 ip address 10.10.0.0 255.255.255.254
 ip access-group FABRIC-IN in
 no shutdown
 negotiation auto
!
interface GigabitEthernet3
 description Downlink to leaf2 GE1/0/0
 ip address 10.10.0.2 255.255.255.254
 ip access-group FABRIC-IN in
 no shutdown
 negotiation auto
!
ip route vrf clab-mgmt 0.0.0.0 0.0.0.0 10.0.0.2
ip ssh maxstartups 128
!
router bgp 65000
 bgp router-id 10.255.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.10.0.1 remote-as 65001
 neighbor 10.10.0.1 description leaf1
 neighbor 10.10.0.3 remote-as 65002
 neighbor 10.10.0.3 description leaf2
 !
 address-family ipv4
  network 10.255.0.11 mask 255.255.255.255
  neighbor 10.10.0.1 activate
  neighbor 10.10.0.3 activate
 exit-address-family
!
snmp-server community public RO
netconf-yang
restconf
!
line con 0
 stopbits 1
line vty 0 4
 login local
 transport input ssh
!
end
