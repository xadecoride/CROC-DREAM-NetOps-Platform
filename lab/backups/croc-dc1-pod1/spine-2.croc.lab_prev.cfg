hostname spine-2
ip routing
interface Ethernet1
   description Downlink to leaf1 GE1/0/1
   no switchport
   ip address 10.10.0.4/31
   ip access-group FABRIC-IN in
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
interface Ethernet2
   description Downlink to leaf2 GE1/0/1
   no switchport
   ip address 10.10.0.6/31
   ip access-group FABRIC-IN in
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
interface Loopback0
   description Router-ID / BGP announce
   ip address 10.255.0.12/32
   ip ospf area 0.0.0.0
ip access-list FABRIC-IN
   10 permit icmp any any
   15 permit ospf any any
   20 permit tcp any any eq bgp
   30 permit tcp any eq bgp any
   40 deny tcp any any eq telnet
   50 permit ip any any
router bgp 65000
   router-id 10.255.0.12
   no bgp default ipv4-unicast
   neighbor 10.10.0.5 remote-as 65001
   neighbor 10.10.0.5 description leaf1
   neighbor 10.10.0.5 send-community extended
   neighbor 10.10.0.7 remote-as 65002
   neighbor 10.10.0.7 description leaf2
   neighbor 10.10.0.7 send-community extended
   !
   address-family evpn
      neighbor 10.10.0.5 activate
      neighbor 10.10.0.5 next-hop-unchanged
      neighbor 10.10.0.7 activate
      neighbor 10.10.0.7 next-hop-unchanged
   !
   address-family ipv4
      network 10.255.0.12/32
      neighbor 10.10.0.5 activate
      neighbor 10.10.0.7 activate
! [TOPOLOGY-LINK-SHUTDOWN Et3]
! [TOPOLOGY-LINK-SHUTDOWN eth1]
! [TOPOLOGY-LINK-SHUTDOWN eth2]
