# Port 80..83 — Authenticated Console (Owner on local hardware / Owner-issued 6-digit code & token over Internet)
server {
    listen 80;
    listen 81;
    listen 82;
    listen 83;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Console-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Id $http_x_client_id;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location ~ ^/(healthz|readyz|metrics|docs|redoc|openapi\.json)$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri /index.html;
    }
}
