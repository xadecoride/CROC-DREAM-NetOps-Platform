# Спринт 2. Правила нормализации (Diff Filtering) для модуля diff
version: 1
note: 'Правила нормализации для модуля diff. confidence: high = типовое поведение ОС, medium = по документации/опыту, проверить на реальном выводе,
  low = предположение.'
common:
  strip_trailing_whitespace: true
  collapse_blank_lines: true
  drop_comment_only_lines: true
  implicit_lines_to_drop_from_intended:
    cisco_iosxe:
    - no shutdown
    arista_eos:
    - no shutdown
    huawei_vrp:
    - undo shutdown
    - traffic-filter inbound acl name FABRIC-IN
    eltex_esr: []
platforms:
  cisco_iosxe:
    indent: 1 space per level
    comment_prefix: '!'
    drop_line_patterns:
    - re: ^Building configuration\.\.\.$
      why: заголовок show run
      confidence: high
    - re: '^Current configuration : \d+ bytes$'
      why: размер меняется
      confidence: high
    - re: ^! Last configuration change at .*
      why: метка времени
      confidence: high
    - re: ^! NVRAM config last updated at .*
      why: метка времени
      confidence: high
    - re: ^! No configuration change since last restart.*
      why: служебный комментарий
      confidence: high
    - re: ^Using \d+ out of \d+ bytes.*
      why: счётчик NVRAM
      confidence: high
    - re: ^ntp clock-period \d+
      why: подстраивается динамически
      confidence: high
    - re: ^version \d+\.\d+
      why: версия ОС не политика
      confidence: high
    - re: ^boot-(start|end)-marker$
      why: служебные маркеры
      confidence: high
    - re: ^end$
      why: конец файла
      confidence: high
    - re: ^\s*no mop (enabled|sysid)$
      why: дефолт интерфейсов Cisco c8000v
      confidence: high
    drop_blocks:
    - start_re: ^crypto pki (trustpoint|certificate chain) TP-self-signed-\d+
      why: локальные сертификаты (с вложенными строками)
      confidence: high
    mask_secrets:
    - re: ^(username \S+ (?:privilege \d+ )?(?:secret|password) \d) \S+
      replace: \1 <hash>
      why: хэш с случайной солью
      confidence: high
    managed_sections:
    - '^hostname '
    - ^interface (?!GigabitEthernet1$)
    - '^router bgp '
    - '^ip access-list '
    unmanaged_examples:
    - interface GigabitEthernet1 (management)
    - username
    - aaa
    - line vty
    - ip ssh
    - ntp
    - logging
    - snmp-server
    - restconf
    - netconf-yang
    - license
    - platform
  arista_eos:
    indent: 3 spaces per level
    comment_prefix: '!'
    drop_line_patterns:
    - re: '^! Command: show running-config.*'
      why: заголовок
      confidence: high
    - re: '^! device: .*'
      why: модель и версия ОС
      confidence: high
    - re: ^! boot system .*
      why: служебный комментарий
      confidence: high
    - re: ^! Startup-config last modified at .*
      why: метка времени
      confidence: high
    - re: '^! Time: .*'
      why: метка времени
      confidence: high
    - re: ^transceiver qsfp default-mode .*
      why: зависит от железа
      confidence: medium
    - re: ^end$
      why: конец файла
      confidence: high
    drop_blocks: []
    mask_secrets:
    - re: ^(username \S+ .*secret sha512) \S+
      replace: \1 <hash>
      why: хэш с случайной солью
      confidence: high
    managed_sections:
    - '^hostname '
    - ^interface (?!Management)
    - '^router bgp '
    - '^ip access-list '
    - ^ip routing$
    unmanaged_examples:
    - interface Management0
    - management api http-commands
    - management ssh
    - daemon TerminAttr
    - username
    - aaa
    - transceiver
  huawei_vrp:
    indent: 1 space per level
    comment_prefix: '#'
    drop_line_patterns:
    - re: ^!Software Version .*
      why: версия ПО
      confidence: medium
    - re: ^!Last configuration was (updated|saved) at .*
      why: метки времени
      confidence: medium
    - re: ^#$
      why: разделитель секций
      confidence: high
    - re: ^return$
      why: конец конфигурации
      confidence: high
    - re: ^\s*(?:undo )?synchronization$
      why: дефолт BGP ipv4-family на CE12800 8.180
      confidence: high
    drop_blocks:
    - start_re: ^ip vpn-instance __LOCAL_OAM_VPN__
      why: служебный VPN, создаётся системой (если присутствует)
      confidence: low
    - start_re: ^interface (?:GE1/0/[2-9]|NULL0)$
      why: неиспользуемые заводские порты CE12800
      confidence: high
    mask_secrets:
    - re: ^(\s*local-user \S+ password (?:irreversible-cipher|cipher)) \S+
      replace: \1 <hash>
      why: хэш пароля
      confidence: medium
    managed_sections:
    - '^sysname '
    - '^acl name '
    - ^interface (?!MEth|GigabitEthernet0/0/0$)
    - ^bgp \d+
    unmanaged_examples:
    - interface MEth0/0/0 (management)
    - local-user
    - aaa
    - stelnet / ssh server
    - snmp-agent
    - info-center
    - ntp-service
    note: Мусор display current-configuration проверить на реальной ноде CE12800 8.180 до фиксации регулярных выражений.
  eltex_esr:
    indent: 2 spaces per level
    comment_prefix: '!'
    drop_line_patterns:
    - re: ^#!/usr/bin/clish$
      why: служебная первая строка вывода
      confidence: low
    - re: ^#\d+$
      why: номер версии конфигурации
      confidence: low
    - re: ^do .*
      why: служебные команды
      confidence: low
    drop_blocks: []
    mask_secrets:
    - re: ^(\s*username \S+\s+password encrypted) \S+
      replace: \1 <hash>
      why: хэш пароля
      confidence: low
    managed_sections:
    - '^hostname '
    - ^interface (?!gigabitethernet 1/0/0$)
    - '^router bgp '
    - '^route-map '
    - '^ip access-list '
    unmanaged_examples:
    - management-интерфейс
    - username
    - aaa
    - ntp
    - logging
    - snmp
    note: 'Все шаблоны этого раздела предположительные: снять реальный show running-config с ESR и пройти по нему.'
  eltex_mes:
    indent: 1 space per level
    comment_prefix: '!'
    drop_line_patterns:
    - re: ^exit$
      why: конец секции
      confidence: medium
    drop_blocks: []
    mask_secrets: []
    managed_sections:
    - '^hostname '
    - ^interface (?!oob$)
    - '^router bgp '
    - '^ip access-list '
  juniper_junos:
    indent: 4 spaces per level
    comment_prefix: '#'
    drop_line_patterns:
    - re: ^## Last commit:.*
      why: метка времени коммита
      confidence: high
    drop_blocks: []
    mask_secrets: []
    managed_sections:
    - ^system
    - ^interfaces
    - ^protocols
    - ^firewall
    - ^routing-options
  yadro_kornfe:
    indent: 2 spaces per level
    comment_prefix: '#'
    drop_line_patterns: []
    drop_blocks: []
    mask_secrets: []
    managed_sections:
    - '^hostname '
    - '^interface '
    - '^router bgp '
    - '^ip access-list '
  linux_server:
    indent: 2 spaces per level
    comment_prefix: '#'
    drop_line_patterns: []
    drop_blocks: []
    mask_secrets: []
    managed_sections:
    - ^auto
    - ^iface
    - ^hostname
dynamic_show_output_fields:
  always_ignore:
  - uptime
  - Up/Down
  - MsgRcvd/MsgSent
  - счётчики пакетов и байт
  - Last clearing of counters
  - RTT в ping
  - timestamps
