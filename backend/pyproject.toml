[project]
name = "netops-backend"
version = "0.1.0"
description = "CROC DREAM NetOps Platform — backend (FastAPI, Celery, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20",
    "celery[redis]>=5.6",
    "cryptography>=42.0",
    "fastapi>=0.141",
    "hier-config>=3.7,<4",
    "jinja2>=3.1",
    "paramiko>=5.0.0",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
    "redis>=5.0",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
scrapli = [
    "scrapli>=2026.2.20",
    "scrapli-community>=2025.1.30",
]

[dependency-groups]
dev = [
    "black>=26.5",
    "httpx2>=2.13",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netops"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT", "C4", "RET", "TID"]
ignore = [
    # Эндпоинты FastAPI и тесты получают зависимости аргументами.
    "E501",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLW0603",
    "PLW2901",
    "PT018",
    "RET504",
    "RUF059",
    "SIM102",
    "SIM105",
    # Кириллица в строках и комментариях — намеренно.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["N999"]
"tests/**/*.py" = ["PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["netops"]

[tool.mypy]
python_version = "3.11"
packages = ["netops"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "hier_config.*",
    "kombu.*",
    "paramiko.*",
    "scrapli.*",
    "scrapli_community.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:netops.*"]
