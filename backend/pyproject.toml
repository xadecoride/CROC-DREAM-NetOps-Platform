[project]
name = "netops-backend"
version = "0.1.0"
description = "CROC DREAM NetOps Platform — backend (FastAPI, Celery, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "hier-config>=3.2,<4",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
scrapli = [
    "scrapli>=2024.7.30",
    "scrapli-community>=2024.7.30",
]

[dependency-groups]
dev = [
    "black>=24.4",
    "httpx2>=2.0",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netops"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT", "C4", "RET", "TID"]
ignore = [
    # Эндпоинты FastAPI и тесты получают зависимости аргументами.
    "PLR0913",
    "PLR0917",
    "PLR2004",
    # Кириллица в строках и комментариях — намеренно.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["N999"]
"tests/**/*.py" = ["PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["netops"]

[tool.mypy]
python_version = "3.11"
packages = ["netops"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery.*", "hier_config.*", "kombu.*", "scrapli.*", "scrapli_community.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:netops.*"]
