# Конфигурация модуля prometheus/snmp_exporter (формат v0.26+: auths + modules).
# Опрашивает стандартный IF-MIB и вендорские OID CPU/RAM в рамках единого последовательного
# SNMP-сеанса на устройство (исключает коллизии UDP-сокетов на WAN socat-релеях).

auths:
  public_v2:
    community: public
    security_level: noAuthNoPriv
    auth_protocol: MD5
    priv_protocol: DES
    version: 2

modules:
  # ─── 1. Базовый IF-MIB (интерфейсы, трафик, ошибки) ────────────────────────
  if_mib:
    max_repetitions: 10
    retries: 1
    timeout: 5s
    walk: &if_walk
      - 1.3.6.1.2.1.2.2.1.8       # ifOperStatus
      - 1.3.6.1.2.1.2.2.1.14      # ifInErrors
      - 1.3.6.1.2.1.2.2.1.20      # ifOutErrors
      - 1.3.6.1.2.1.31.1.1.1.6    # ifHCInOctets (64-bit)
      - 1.3.6.1.2.1.31.1.1.1.10   # ifHCOutOctets (64-bit)
    metrics: &if_metrics
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer

  # ─── 2. IF-MIB + CPU/RAM для Arista / Linux (HOST-RESOURCES-MIB) ───────────
  host_resources:
    max_repetitions: 10
    retries: 1
    timeout: 5s
    walk:
      - 1.3.6.1.2.1.2.2.1.8
      - 1.3.6.1.2.1.2.2.1.14
      - 1.3.6.1.2.1.2.2.1.20
      - 1.3.6.1.2.1.31.1.1.1.6
      - 1.3.6.1.2.1.31.1.1.1.10
      - 1.3.6.1.2.1.25.3.3.1.2  # hrProcessorLoad
      - 1.3.6.1.2.1.25.2.3.1.5  # hrStorageSize
      - 1.3.6.1.2.1.25.2.3.1.6  # hrStorageUsed
    metrics:
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: hrProcessorLoad
        oid: 1.3.6.1.2.1.25.3.3.1.2
        type: gauge
        indexes:
          - labelname: hrDeviceIndex
            type: Integer
      - name: hrStorageSize
        oid: 1.3.6.1.2.1.25.2.3.1.5
        type: gauge
        indexes:
          - labelname: hrStorageIndex
            type: Integer
      - name: hrStorageUsed
        oid: 1.3.6.1.2.1.25.2.3.1.6
        type: gauge
        indexes:
          - labelname: hrStorageIndex
            type: Integer

  # ─── 3. IF-MIB + CPU/RAM для Cisco (CISCO-PROCESS-MIB) ─────────────────────
  cisco_cpu:
    max_repetitions: 10
    retries: 1
    timeout: 5s
    walk:
      - 1.3.6.1.2.1.2.2.1.8
      - 1.3.6.1.2.1.2.2.1.14
      - 1.3.6.1.2.1.2.2.1.20
      - 1.3.6.1.2.1.31.1.1.1.6
      - 1.3.6.1.2.1.31.1.1.1.10
      - 1.3.6.1.2.1.31.1.1.1.15         # ifHighSpeed (Mbps)
      - 1.3.6.1.4.1.9.9.109.1.1.1.1.6  # cpmCPUTotal5secRev
      - 1.3.6.1.4.1.9.9.109.1.1.1.1.7  # cpmCPUTotal1minRev
      - 1.3.6.1.4.1.9.9.48.1.1.1.5     # ciscoMemoryPoolUsed
      - 1.3.6.1.4.1.9.9.48.1.1.1.6     # ciscoMemoryPoolFree
    metrics:
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifHighSpeed
        oid: 1.3.6.1.2.1.31.1.1.1.15
        type: gauge
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: cpmCPUTotal5secRev
        oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.6
        type: gauge
        indexes:
          - labelname: cpmCPUTotalIndex
            type: Integer
      - name: cpmCPUTotal1minRev
        oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.7
        type: gauge
        indexes:
          - labelname: cpmCPUTotalIndex
            type: Integer
      - name: ciscoMemoryPoolUsed
        oid: 1.3.6.1.4.1.9.9.48.1.1.1.5
        type: gauge
        indexes:
          - labelname: ciscoMemoryPoolType
            type: Integer
      - name: ciscoMemoryPoolFree
        oid: 1.3.6.1.4.1.9.9.48.1.1.1.6
        type: gauge
        indexes:
          - labelname: ciscoMemoryPoolType
            type: Integer

  # ─── 4. IF-MIB + CPU/RAM для Huawei VRP (HUAWEI-ENTITY-EXTENT-MIB) ─────────
  huawei_cpu:
    max_repetitions: 10
    retries: 1
    timeout: 5s
    walk:
      - 1.3.6.1.2.1.2.2.1.8
      - 1.3.6.1.2.1.2.2.1.14
      - 1.3.6.1.2.1.2.2.1.20
      - 1.3.6.1.2.1.31.1.1.1.6
      - 1.3.6.1.2.1.31.1.1.1.10
      - 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.5  # hwEntityCpuUsage
      - 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.7  # hwEntityMemUsage
    metrics:
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        indexes:
          - labelname: ifIndex
            type: Integer
      - name: hwEntityCpuUsage
        oid: 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.5
        type: gauge
        indexes:
          - labelname: entPhysicalIndex
            type: Integer
      - name: hwEntityMemUsage
        oid: 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.7
        type: gauge
        indexes:
          - labelname: entPhysicalIndex
            type: Integer
