apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: "3.15.0"

  # Та же PromQL, но с историей на месяцы (Prometheus хранит только 3 дня).
  - name: VictoriaMetrics
    type: prometheus
    uid: victoriametrics
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  - name: PostgreSQL-NetOps
    type: postgres
    uid: postgres-netops
    access: proxy
    url: postgres:5432
    user: netops
    database: netops
    editable: false
    secureJsonData:
      password: netops
    jsonData:
      sslmode: "disable"
      postgresVersion: 1700
      timescaledb: false
