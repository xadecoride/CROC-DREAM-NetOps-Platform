global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

# Долгая история — в VictoriaMetrics; Prometheus держит короткое окно для алертов и
# оперативных запросов платформы (прогноз, /api/v1/targets).
remote_write:
  - url: http://victoriametrics:8428/api/v1/write

# Цели SNMP / exporter сохраняет платформа в PostgreSQL (backend/netops/telemetry/targets.py) после
# проверки протокола и отдаёт через HTTP Service Discovery (/api/v1/telemetry/sd/*).
scrape_configs:
  - job_name: "netops_backend"
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "netops_(telemetry_(active_protocol|fallback_events_total)|devices_total|drift_devices(_total)?|device_(reachable|cpu_utilization_percent|memory_utilization_percent|uplink_utilization_percent)|bgp_(session_up|prefixes_accepted)|server_(cpu_utilization_percent|memory_utilization_percent|disk_utilization_percent|network_rate_mbps|load_1m))"
        action: keep

  - job_name: "snmp_fabric"
    scrape_interval: 60s
    scrape_timeout: 25s
    metrics_path: /snmp
    params:
      auth: [public_v2]
      module: [if_mib]
    http_sd_configs:
      - url: http://api:8000/api/v1/telemetry/sd/snmp
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [snmp_module]
        regex: "(.+)"
        target_label: __param_module
      - target_label: __address__
        replacement: snmp-exporter:9116
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "snmp_.*"
        action: drop

  - job_name: "node_exporter_fleet"
    scrape_interval: 30s
    scrape_timeout: 15s
    params:
      collect[]:
        - cpu
        - meminfo
        - filesystem
        - netdev
        - loadavg
    http_sd_configs:
      - url: http://api:8000/api/v1/telemetry/sd/exporter
        refresh_interval: 30s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "node_(cpu_seconds_total|memory_MemAvailable_bytes|memory_MemTotal_bytes|filesystem_avail_bytes|filesystem_size_bytes|network_receive_bytes_total|network_transmit_bytes_total|load1)"
        action: keep
      - source_labels: [__name__, mode]
        regex: "node_cpu_seconds_total;(user|system|nice|iowait|irq|softirq|steal|guest.*)"
        action: drop
      - source_labels: [__name__, mountpoint]
        regex: "node_filesystem_.*;/.+"
        action: drop
      - source_labels: [__name__, device]
        regex: "node_network_.*;(lo|veth.*|docker.*|br-.*|virbr.*|tun.*|tap.*)"
        action: drop

  - job_name: "gnmic"
    scrape_interval: 30s
    static_configs:
      - targets: ["gnmic:9804"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "gnmi_(components_component_cpu_utilization_state_instant|system_memory_state_(used|physical)|interfaces_interface_state_(oper_status|counters_(in_octets|out_octets|in_discards))|network_instances_network_instance_protocols_protocol_bgp_neighbors_neighbor_state_session_state)"
        action: keep
