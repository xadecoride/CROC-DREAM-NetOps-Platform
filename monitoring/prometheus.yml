# Prometheus снимает метрики с API. Значения считает воркер раз в
# NETOPS_METRICS_INTERVAL_SECONDS и пишет в таблицу metric_samples,
# /metrics отдаёт срез последнего сбора.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: netops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
