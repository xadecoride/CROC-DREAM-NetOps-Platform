name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Ветки этого репозитория проверяются по push, поэтому по pull_request гоняем только PR из форков.
jobs:
  backend:
    name: "Бэкенд: линтеры и тесты"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: backend
          python-version: "3.11"
          enable-cache: true

      - name: Зависимости
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

      - name: Black
        run: uv run black --check --diff .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov=netops --cov-report=term-missing:skip-covered

      - name: Покрытие в сводку
        run: uv run coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: "Фронтенд: сборка и типы"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Зависимости
        run: npm ci

      - name: Сборка
        run: npm run build

  stack:
    name: "Стек в docker compose"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Проверка docker-compose.yml
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Сборка образа бэкенда
        uses: docker/build-push-action@v7
        with:
          context: backend
          tags: netops-backend:latest
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Стек на данных из репозитория (intent/, templates/, lab/running/), как у команды локально.
      # Скан по расписанию раз в минуту, чтобы smoke-тест дождался задачи от Beat.
      - name: Настройки стенда
        run: |
          cp backend/.env.example backend/.env
          sed -i 's/^NETOPS_DRIFT_SCAN_INTERVAL_SECONDS=.*/NETOPS_DRIFT_SCAN_INTERVAL_SECONDS=60/' backend/.env

      - name: Запуск стека
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Smoke-тест
        run: python3 backend/scripts/smoke_stack.py --beat-timeout 150

      - name: Логи контейнеров
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Остановка стека
        if: always()
        run: docker compose down --volumes

  publish:
    name: Публикация образа в GHCR
    needs: [backend, frontend, stack]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/netops-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Сборка и публикация
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
